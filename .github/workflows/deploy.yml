name: Deploy TicketDesk (Frontend & Backend)

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: poc-ticketdesk-appilcation
  ECS_SERVICE: poc-service
  ECS_CLUSTER: poc-cluster
  ECS_TASK_DEFINITION: poc-task
  FRONTEND_BUCKET: poc-frontend-app-bucket
  CLOUDFRONT_URL: https://d2l7w04nxsto25.cloudfront.net

permissions:
  id-token: write
  contents: read

jobs:
  test-and-scan:
    name: Secret Scan & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Run Unit Tests
        run: pytest tests/

  deploy-app:
    name: Deploy Infrastructure Assets
    needs: test-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::472151629881:role/poc-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      # --- STEP 1: DEPLOY FRONTEND TO S3 ---
      - name: Deploy Static Frontend to S3
        run: |
          echo "Syncing frontend static files to S3 bucket: ${{ env.FRONTEND_BUCKET }}"
          aws s3 sync static/ s3://${{ env.FRONTEND_BUCKET }}/ --delete

      # --- STEP 2: BUILD & PUSH BACKEND TO ECR ---
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # --- STEP 3: UPDATE ECS SERVICE ---
      - name: Download Active Task Definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} --query taskDefinition > task-definition.json

      - name: Fill in New Image ID in Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # --- STEP 4: SMOKE TEST ---
      - name: Run Smoke Test against CloudFront
        run: |
          echo "Performing HTTP health check against CloudFront API endpoint..."
          curl --fail --max-time 30 "${{ env.CLOUDFRONT_URL }}/api/health" || exit 1
