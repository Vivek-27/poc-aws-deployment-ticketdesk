name: TicketDesk CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: poc-ticketdesk-appilcation
  ECS_CLUSTER: tkt-vk-cluster
  ECS_SERVICE: tkt-vk-service
  ECS_TASK_DEFINITION: .aws/task-definition.json
  CONTAINER_NAME: app
  CLOUDFRONT_URL: https://d2dx6nyno76d22.cloudfront.net

jobs:

  # ==========================================
  # 1. UNIT TESTS
  # ==========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest -v


  # ==========================================
  # 2. SECRET SCAN
  # ==========================================
  secret-scan:
    name: Scan Repository for Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2


  # ==========================================
  # 3. BUILD + PUSH + DEPLOY
  # ==========================================
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    needs:
      - test
      - secret-scan

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------
      # AWS LOGIN
      # ------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::472151629881:role/tkt-vk-github-actions-role
          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------
      # ECR LOGIN
      # ------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ------------------------------------------
      # BUILD IMAGE
      # ------------------------------------------
      - name: Build Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"


      # ------------------------------------------
      # PUSH IMAGE TO ECR
      # ------------------------------------------
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      # ------------------------------------------
      # UPDATE ECS TASK DEFINITION
      # ------------------------------------------
      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.IMAGE }}


      # ------------------------------------------
      # DEPLOY TO ECS
      # ------------------------------------------
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


      # ------------------------------------------
      # SMOKE TEST
      # ------------------------------------------
      - name: Smoke test
        run: |
          echo "Waiting for application..."
          sleep 20

          echo "Testing CloudFront:"
          echo "${CLOUDFRONT_URL}/health"

          curl --fail \
            --silent \
            --show-error \
            "${CLOUDFRONT_URL}/health"

          echo ""
          echo "Smoke test passed!"
